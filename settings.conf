# Configuration centrale de RampCam (pas de secrets ici : voir config_local.py).
# Lue par settings.py (Python) et, pour les scripts shell, via `python3 app/settings.py <cle>`.
# "~" est developpe ; ${cle} reprend une autre valeur de la section ;
# un chemin relatif est resolu par rapport au dossier app/.

[paths]
# Racine des donnees generees, hors de l'arborescence du projet
data_dir = ~/Vidéos/RampCam_videos
# Videos enregistrees (nettoyees apres --max-age-hours)
captures_dir = ${data_dir}
# Logs journaliers de detect.py et log des watchdogs
logs_dir = ${data_dir}/logs
# Sortie des videos annotees par classify.py
annotated_dir = ${data_dir}/annotated
